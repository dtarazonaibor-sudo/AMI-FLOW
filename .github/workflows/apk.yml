name: Construir APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx expo install react react-native expo-status-bar react-native-safe-area-context @react-native-async-storage/async-storage @react-native-community/datetimepicker expo-clipboard firebase
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk AMIFlow.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AMI Flow (última versión)
          files: AMIFlow.apk
